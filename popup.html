<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { width: 360px; height: 500px; font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col">
    <header class="bg-indigo-600 p-4 text-white shadow-md">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-microscope text-xl"></i>
                <h1 class="font-bold text-lg tracking-tight">KeywordSpy</h1>
            </div>
            <button id="open-dashboard" class="text-white/80 hover:text-white">
                <i class="fas fa-external-link-alt"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
        <div id="status-card" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-2">
                <span id="page-type" class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Detecting...</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            </div>
            <h2 id="page-title" class="text-sm font-bold text-slate-800 truncate mb-1">Current Page Loading...</h2>
            <p id="page-url" class="text-[10px] text-slate-400 truncate mb-4">--</p>
            
            <div class="flex items-center gap-3 p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                <div class="bg-indigo-600 text-white p-2 rounded-md">
                    <i class="fas fa-key"></i>
                </div>
                <div>
                    <p id="keyword-count" class="text-xs font-bold text-indigo-900">0 Keywords Extracted</p>
                    <p class="text-[10px] text-indigo-500">Auto-captured just now</p>
                </div>
            </div>
        </div>

        <div class="space-y-2">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Assignment</h3>
            <select id="group-select" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs font-medium text-slate-600 outline-none focus:ring-2 ring-indigo-100">
                <option value="">Unassigned</option>
                <option value="g1">Fitness Competitors</option>
                <option value="g2">Meditation Apps</option>
                <option value="new">+ Create New Group</option>
            </select>
            <button id="add-to-group" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition-all">
                ADD DOMAIN TO GROUP
            </button>
        </div>
    </main>

    <footer class="p-3 bg-white border-t border-slate-200 flex gap-2">
        <button id="view-analysis" class="flex-1 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-100 transition-all">
            FULL ANALYSIS
        </button>
        <button id="export-btn" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-200">
            <i class="fas fa-download"></i>
        </button>
    </footer>

    <script>
        document.getElementById('open-dashboard').onclick = () => chrome.runtime.openOptionsPage();
        document.getElementById('view-analysis').onclick = () => chrome.runtime.openOptionsPage();
        
        // Mock data update logic for the popup
        chrome.storage.local.get(['lastExtraction'], (result) => {
            if (result.lastExtraction) {
                const data = result.lastExtraction;
                document.getElementById('page-title').innerText = data.title;
                document.getElementById('page-url').innerText = data.url;
                document.getElementById('page-type').innerText = data.type === 'appstore' ? 'App Store Page' : 'Website Page';
                document.getElementById('keyword-count').innerText = `${Object.keys(data.rawKeywords).length} Keywords Extracted`;
            }
        });
    </script>
</body>
</html>
