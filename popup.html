<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { width: 320px; background: #09090b; color: #fafafa; font-family: sans-serif; }
    </style>
</head>
<body class="p-5">
    <div class="flex items-center justify-between mb-6">
        <span class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">KeywordSpy Pro</span>
        <button id="go-dash" class="text-zinc-500 hover:text-white"><i class="fas fa-external-link-alt text-xs"></i></button>
    </div>
    
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-4">
        <p id="page-name" class="text-xs font-bold truncate text-zinc-400 mb-1">Scanning page...</p>
        <h2 id="kw-count" class="text-3xl font-black">0</h2>
        <p class="text-[9px] font-bold text-zinc-500 uppercase">Keywords Detected</p>
    </div>

    <button id="sync-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-black transition-all">
        SYNC INTELLIGENCE
    </button>

    <script>
        const storage = {
            get: (key, cb) => (typeof chrome !== 'undefined' && chrome.storage) ? chrome.storage.local.get(key, cb) : cb({lastExtraction: JSON.parse(localStorage.getItem(key))}),
        };

        document.getElementById('go-dash').onclick = () => chrome.runtime.openOptionsPage();

        storage.get(['lastExtraction'], (res) => {
            if(res.lastExtraction) {
                document.getElementById('page-name').innerText = res.lastExtraction.title;
                document.getElementById('kw-count').innerText = Object.keys(res.lastExtraction.rawKeywords).length;
            }
        });
    </script>
</body>
</html>
